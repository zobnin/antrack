apply plugin: 'com.android.application'

repositories {
    maven { url "https://mint.splunk.com/gradle/" }
    maven { url "https://jitpack.io" }
}

android {
    compileSdkVersion 25
    buildToolsVersion '25.0.1'

    defaultConfig {
        applicationId "org.antrack.app"
        minSdkVersion 19
        targetSdkVersion 25
        versionCode 1
        versionName "1.0"

        manifestPlaceholders = [onesignal_app_id: "90b00836-3c46-43ca-930d-1d4dca449771",
                                // Project number pulled from dashboard, local value is ignored.
                                onesignal_google_project_number: "REMOTE"]
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile 'com.android.support:appcompat-v7:25.1.1'
    compile 'com.android.support:design:25.1.1'
    compile 'com.android.support:cardview-v7:25.1.1'
    compile 'com.android.support:recyclerview-v7:25.1.1'
    compile 'com.google.android.gms:play-services-maps:10.2.0'
    compile 'com.dropbox.core:dropbox-core-sdk:2.1.2'
    compile 'com.splunk.mint:mint:5.0.0'
    compile 'com.github.amlcurran.showcaseview:library:5.4.3'
    compile 'com.karumi:dexter:3.0.0'

    // OSignal
    compile 'com.onesignal:OneSignal:3.+@aar'
    // Required for OSignal, even if you have added FCM.
    compile 'com.google.android.gms:play-services-gcm:+'
    // Required for geotagging
    compile "com.google.android.gms:play-services-location:+"
}

