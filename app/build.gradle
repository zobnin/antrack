apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

repositories {
    maven { url "https://mint.splunk.com/gradle/" }
    maven { url "https://jitpack.io" }
}

android {
    compileSdkVersion 25
    buildToolsVersion '25.0.2'

    defaultConfig {
        applicationId "org.antrack.app"
        minSdkVersion 19
        targetSdkVersion 25
        versionCode 4
        versionName "0.2.0"
        multiDexEnabled true

        manifestPlaceholders = [onesignal_app_id: "90b00836-3c46-43ca-930d-1d4dca449771",
                                // Project number pulled from dashboard, local value is ignored.
                                onesignal_google_project_number: "REMOTE"]
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }
}

final SUPPORT_VERSION = '25.4.0'
final KOTLIN_VERSION = '1.1.2'
final ANKO_VERSION = '0.9.1'

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile "com.android.support:appcompat-v7:$SUPPORT_VERSION"
    compile "com.android.support:design:$SUPPORT_VERSION"
    compile "com.android.support:cardview-v7:$SUPPORT_VERSION"
    compile "com.android.support:recyclerview-v7:$SUPPORT_VERSION"
    compile "com.google.android.gms:play-services-maps:10.2.6"
    compile 'com.dropbox.core:dropbox-core-sdk:2.1.2'
    compile 'com.splunk.mint:mint:5.0.0'
    compile 'com.github.deano2390:MaterialShowcaseView:1.1.0@aar'
    compile 'com.karumi:dexter:3.0.0'

    compile "org.jetbrains.anko:anko-sdk15:$ANKO_VERSION"
    compile "org.jetbrains.anko:anko-appcompat-v7:$ANKO_VERSION"
    compile "org.jetbrains.anko:anko-recyclerview-v7:$ANKO_VERSION"
    compile "org.jetbrains.anko:anko-design:$ANKO_VERSION"
    compile "org.jetbrains.kotlin:kotlin-stdlib:$KOTLIN_VERSION"
    compile 'com.github.yongjhih:kotlin-system-services:-SNAPSHOT'

    // OSignal
    compile 'com.onesignal:OneSignal:3.+@aar'
    // Required for OSignal, even if you have added FCM.
    compile 'com.google.android.gms:play-services-gcm:10.2.6'
    // Required for geotagging
    compile "com.google.android.gms:play-services-location:10.2.6"
}

