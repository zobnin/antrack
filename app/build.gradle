plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
localProperties.load(new FileInputStream(rootProject.file("local.properties")))

android {
    namespace = 'app'
    compileSdk = 36

    defaultConfig {
        applicationId = "org.antrack.app"
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = "0.1.0"
        buildConfigField "String", "DROPBOX_KEY", localProperties['dropboxKey']
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable = true
            minifyEnabled = false
        }
    }
}

dependencies {
    // 7.1+ is built with Kotlin 2.4 metadata, which the stable AGP 9.3.1
    // built-in Kotlin 2.2 compiler cannot read yet. 7.0.0 already contains
    // Dropbox's required server-certificate compatibility fix.
    implementation 'com.dropbox.core:dropbox-core-sdk:7.0.0'
    implementation 'com.dropbox.core:dropbox-android-sdk:7.0.0'
}
